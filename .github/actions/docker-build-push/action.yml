name: "Docker Build and Push"
description: "Build a Docker image tagged with the commit SHA; push to the registry only when push=true"

inputs:
  registry:
    description: "Container registry host (docker.io = Docker Hub)"
    required: false
    default: "docker.io"
  image-name:
    description: "Image repository without registry or tag (e.g. tert62/dsc-api-gateway)"
    required: true
  image-tag:
    description: "Image tag; use the full commit SHA, never latest"
    required: true
  context:
    description: "Docker build context"
    required: false
    default: "."
  push:
    description: "'true' = login + push, 'false' = build only (proves the Dockerfile)"
    required: false
    default: "false"
  registry-username:
    description: "Registry username (composite actions cannot read secrets; the caller passes it in)"
    required: false
  registry-password:
    description: "Registry access token"
    required: false

runs:
  using: "composite"
  steps:
    - uses: docker/setup-buildx-action@v3

    - name: Login to registry
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build (and push if enabled)
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
