name: "Docker Build and Push"
description: "Build a Docker image tagged with the commit SHA; push to the registry only when push=true"

inputs:
  registry:
    description: "Container registry host (docker.io = Docker Hub)"
    required: false
    default: "docker.io"
  image-name:
    description: "Image repository without registry or tag (e.g. tert62/dsc-api-gateway)"
    required: true
  image-tag:
    description: "Image tag; use the full commit SHA, never latest"
    required: true
  context:
    description: "Docker build context"
    required: false
    default: "."
  push:
    description: "'true' = login + push, 'false' = build only (proves the Dockerfile)"
    required: false
    default: "false"
  platforms:
    description: "Comma-separated target platforms, e.g. linux/amd64,linux/arm64 (multi-arch = one tag, one index digest, runs on Intel and ARM nodes)"
    required: false
    default: "linux/amd64"
  registry-username:
    description: "Registry username (composite actions cannot read secrets; the caller passes it in)"
    required: false
  registry-password:
    description: "Registry access token"
    required: false

outputs:
  digest:
    description: "Image digest (sha256:...) reported by the registry push; empty on build-only"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: "composite"
  steps:
    # QEMU only when a non-amd64 platform is requested (the hosted runner is amd64)
    - if: inputs.platforms != 'linux/amd64'
      uses: docker/setup-qemu-action@v4

    - uses: docker/setup-buildx-action@v4

    - name: Login to registry
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build (and push if enabled)
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
