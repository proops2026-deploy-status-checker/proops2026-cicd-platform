name: "Build App (Node)"
description: "Set up Node, install deps with npm ci, run one npm script (lint / test / test:coverage)"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  working-directory:
    description: "Directory containing package.json"
    required: false
    default: "."
  script:
    description: "npm script to run after install (e.g. lint, test, test:coverage)"
    required: false
    default: "test"
  prepare-script:
    description: "Optional npm script(s), space-separated, run in order after install, before `script` (e.g. 'prisma:generate prisma:migrate'). Empty = skip"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v5 # lowest major on the Node 24 runtime
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install (lockfile-exact)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    # Code generation that lint/build/test depend on (Prisma client for deploy-service / log-service)
    - name: Run prepare script(s)
      if: inputs.prepare-script != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PREPARE: ${{ inputs.prepare-script }}
      # Word-splitting on spaces is intended (npm script names contain no spaces); each runs in order, set -e stops on failure
      run: |
        for s in $PREPARE; do
          echo "::group::npm run $s"
          npm run "$s"
          echo "::endgroup::"
        done

    # Input goes through env, not ${{ }} inside run:, so it is never parsed as shell code (script injection)
    - name: Run npm script
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPT: ${{ inputs.script }}
      run: npm run "$SCRIPT"
