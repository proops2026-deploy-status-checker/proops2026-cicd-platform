name: "Terraform Setup"
description: "Install a pinned Terraform, configure AWS credentials, then init (remote backend) + fmt check + validate"

inputs:
  working-directory:
    description: "Terraform root module directory (e.g. iac/dev)"
    required: true
  terraform-version:
    description: "Exact Terraform version; >= 1.10 for S3 native state locking (use_lockfile)"
    required: false
    default: "1.14.9"
  aws-region:
    description: "AWS region"
    required: false
    default: "us-west-2"
  aws-access-key-id:
    description: "AWS access key ID (composite actions cannot read secrets; the caller passes it in)"
    required: true
  aws-secret-access-key:
    description: "AWS secret access key"
    required: true

runs:
  using: "composite"
  steps:
    - name: Check working directory exists
      shell: bash
      env:
        DIR: ${{ inputs.working-directory }}
      run: |
        if [ ! -d "$DIR" ]; then
          echo "::error::Terraform directory '$DIR' does not exist in this repo (no such environment yet?)"
          exit 1
        fi

    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false # plain exit codes + stdout; the wrapper only adds step outputs

    - uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false -no-color

    # Checks the whole iac/ tree (env + modules), fails on unformatted code
    - name: Format check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform fmt -check -recursive -diff ..

    - name: Validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform validate -no-color
